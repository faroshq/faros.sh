<header class="absolute w-full z-30 backdrop-blur-md bg-white/90 dark:bg-gray-900/90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">

            <!-- Site branding -->
            <div class="flex-shrink-0 mr-8">
                <!-- Logo -->
                <a class="block" href="/" aria-label="Faros Platform">
                    <img width="140" height="140" src="/images/logo.svg" alt="Faros Platform Logo" class="transition-transform duration-300 hover:scale-105">
                </a>
            </div>

            <!-- Desktop navigation -->
            <nav class="hidden md:flex md:flex-grow">
                <!-- Desktop menu links -->
                <ul class="flex flex-grow flex-wrap items-center font-semibold text-sm">
                    <li>
                        <a href="/docs/"
                           class="text-gray-700 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 px-4 py-2 rounded-md transition duration-200 ease-in-out hover:bg-gray-50 dark:hover:bg-gray-800">
                           Documentation
                        </a>
                    </li>

                    <li>
                        <a href="/blogs/"
                           class="text-gray-700 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 px-4 py-2 rounded-md transition duration-200 ease-in-out hover:bg-gray-50 dark:hover:bg-gray-800">
                           Blog
                        </a>
                    </li>

                    <li>
                        <a href="https://github.com/faroshq/faros" target="_blank" rel="noopener"
                           class="text-gray-700 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 px-4 py-2 rounded-md transition duration-200 ease-in-out hover:bg-gray-50 dark:hover:bg-gray-800 flex items-center">
                           <span>GitHub</span>
                           <svg class="w-4 h-4 ml-1" fill="currentColor" viewBox="0 0 24 24">
                               <path d="M12 0C5.374 0 0 5.373 0 12 0 17.302 3.438 21.8 8.207 23.387c.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                           </svg>
                        </a>
                    </li>

                    <li>
                        <a href="/contact/"
                           class="text-gray-700 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 px-4 py-2 rounded-md transition duration-200 ease-in-out hover:bg-gray-50 dark:hover:bg-gray-800">
                           Contact
                        </a>
                    </li>
                </ul>

                <!-- CTA Buttons -->
                <div class="ml-6 flex items-center gap-3">
                    <a href="https://console.faros.sh"
                       class="text-gray-700 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400 px-6 py-2.5 rounded-lg font-semibold text-sm transition duration-200 ease-in-out border-2 border-gray-200 dark:border-gray-700 hover:border-blue-300 dark:hover:border-blue-500">
                       Login
                    </a>
                    <a href="/docs/getting-started/"
                       class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition duration-200 ease-in-out shadow-md hover:shadow-lg">
                       Get Started
                    </a>
                </div>
            </nav>

            <!-- Mobile menu button -->
            <div class="md:hidden" x-data="{ expanded: false }">
                <button type="button" 
                        @click.stop="expanded = !expanded"
                        class="bg-gray-50 dark:bg-gray-800 rounded-md p-2 inline-flex items-center justify-center text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700 transition duration-200">
                    <span class="sr-only">Open main menu</span>
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <!-- Mobile menu -->
                <div x-show="expanded"
                     x-transition:enter="transition ease-out duration-200 transform"
                     x-transition:enter-start="opacity-0 -translate-x-full"
                     x-transition:enter-end="opacity-100 translate-x-0"
                     x-transition:leave="transition ease-out duration-200"
                     x-transition:leave-start="opacity-100"
                     x-transition:leave-end="opacity-0"
                     @click.away="expanded = false"
                     class="absolute top-20 left-0 right-0 bg-white dark:bg-gray-900 shadow-lg border-t border-gray-200 dark:border-gray-700"
                     x-cloak>
                    <div class="px-4 py-6 space-y-1">
                        <a href="/docs/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-gray-700">Documentation</a>
                        <a href="/blogs/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-gray-700">Blog</a>
                        <a href="https://github.com/faroshq/faros" target="_blank" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-gray-700">GitHub</a>
                        <a href="/contact/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-gray-700">Contact</a>
                        <a href="https://console.faros.sh" class="block mx-3 mt-4 px-4 py-2 rounded-lg text-base font-semibold border-2 border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 text-center">Login</a>
                        <a href="/docs/getting-started/" class="block mx-3 mt-2 px-4 py-2 rounded-lg text-base font-semibold bg-blue-600 text-white hover:bg-blue-700 text-center">Get Started</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
