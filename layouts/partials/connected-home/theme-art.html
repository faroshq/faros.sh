{{ $hero := eq .kind "hero" }}
{{ $light := "connected-detail-light" }}{{ $dark := "layers-dark-detail" }}
{{ if $hero }}{{ $light = "connected-core-light" }}{{ $dark = "open-structure-core" }}{{ end }}
<figure class="{{ if $hero }}gs-hero-art cl-hero-art{{ else }}ly-detail cl-detail-art{{ end }}" aria-hidden="true">
  {{ range $theme, $asset := dict "light" $light "dark" $dark }}
  <picture class="cl-picture" data-art-theme="{{ $theme }}">
    <source media="(max-width: 650px)" srcset="/images/grounded/{{ $asset }}-small.webp">
    <img src="/images/grounded/{{ $asset }}.webp" width="1536" height="1024" alt="" {{ if $hero }}fetchpriority="high"{{ else }}loading="lazy"{{ end }}>
  </picture>
  {{ end }}
  {{ if $hero }}
  <svg class="cl-circuit" viewBox="0 0 1536 1024" fill="none" aria-hidden="true">
    <defs>
      <radialGradient id="cl-core-light">
        <stop stop-color="#e8d9ff" stop-opacity=".65"/>
        <stop offset=".3" stop-color="#c09aff" stop-opacity=".45"/>
        <stop offset=".65" stop-color="#a970ff" stop-opacity=".15"/>
        <stop offset="1" stop-color="#a970ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="cl-arrival-light" stroke="none">
      <ellipse cx="1055" cy="533" rx="158" ry="175" fill="url(#cl-core-light)"/>
      <path d="m995 456 87 26v123l-87-30Z" fill="#dbc4ff" fill-opacity=".14"/>
    </g>
  </svg>
  {{ else }}
  <svg class="cl-channel-filter" width="0" height="0" aria-hidden="true">
    <defs>
      <filter id="cl-violet-channels" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <!-- Violet has more red and blue than green. Neutral stone stays transparent. -->
        <feColorMatrix type="matrix" values="0 0 0 0 .84  0 0 0 0 .70  0 0 0 0 1  2 -4 2 0 -.05"/>
      </filter>
    </defs>
  </svg>
  <div class="cl-channel-light">
    <div class="cl-channel-breath">
      {{ range $theme, $asset := dict "light" $light "dark" $dark }}
      <picture class="cl-picture" data-art-theme="{{ $theme }}">
        <source media="(max-width: 650px)" srcset="/images/grounded/{{ $asset }}-small.webp">
        <img src="/images/grounded/{{ $asset }}.webp" width="1536" height="1024" alt="" loading="lazy">
      </picture>
      {{ end }}
    </div>
  </div>
  {{ end }}
</figure>
