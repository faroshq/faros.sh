<style>
@font-face{font-family:VCArchivo;src:url('/fonts/violet-circuit/archivo.woff2') format('woff2');font-weight:100 900;font-stretch:62% 125%;font-style:normal;font-display:swap}
@font-face{font-family:VCInstrument;src:url('/fonts/violet-circuit/instrument-sans.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:VCMono;src:url('/fonts/violet-circuit/ibm-plex-mono.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
.violet-circuit {
 --vc-ground:#0a0b12; --vc-raised:#111320; --vc-ink:#e9e9f2; --vc-muted:#9b9db5; --vc-violet:#8b6bff; --vc-bright:#a18aff; --vc-on:#0a0b12; --vc-rule:rgba(255,255,255,.11);
 --vc-display:VCArchivo,'Archivo',sans-serif; --vc-body:VCInstrument,'Instrument Sans',sans-serif; --vc-mono:VCMono,'IBM Plex Mono',monospace;
 background:var(--vc-ground); color:var(--vc-ink); font-family:var(--vc-body); overflow:clip; isolation:isolate;
}
html.light .violet-circuit {--vc-ground:#f1f1f6;--vc-raised:#ffffff;--vc-ink:#14152a;--vc-muted:#565975;--vc-violet:#6b48e8;--vc-bright:#5a38d6;--vc-on:#ffffff;--vc-rule:#dfdeeb;}
.violet-circuit ::selection{background:var(--vc-violet);color:var(--vc-on)}
.violet-circuit a{color:inherit;text-decoration:none;text-underline-offset:5px}
.violet-circuit a:focus-visible{outline:2px solid var(--vc-violet);outline-offset:8px}
.violet-circuit h1,.violet-circuit h2,.violet-circuit h3{font-family:var(--vc-display);font-stretch:125%;font-weight:500;letter-spacing:-.035em;margin:0;line-height:1.03}
.violet-circuit p{font-size:clamp(17px,1.45vw,21px);line-height:1.65;color:var(--vc-muted);margin:0}
.vc-scene{position:relative;--flow:0;scroll-margin-top:80px}
.violet-circuit path{animation:none;stroke-dasharray:none}
.vc-hero{min-height:1040px;height:calc(100svh + 200px);max-height:1250px}
.vc-hero-copy{position:relative;z-index:2;padding:clamp(95px,10vw,155px) 0 0 6.25%;width:70%}
.violet-circuit h1{font-size:clamp(68px,8.1vw,124px);line-height:.99;max-width:1050px;font-weight:500}
.vc-period{color:var(--vc-violet)}
.vc-hero-copy p{max-width:440px;margin-top:38px}
.vc-actions{display:flex;align-items:center;gap:30px;margin-top:32px}
.violet-circuit .vc-cta{display:inline-flex;align-items:center;justify-content:space-between;gap:40px;background:var(--vc-violet);color:var(--vc-on);padding:17px 22px;border-radius:4px;font-weight:600;font-size:16px;transition:background 160ms,box-shadow 160ms}
.violet-circuit .vc-cta:hover{background:var(--vc-bright);box-shadow:0 0 22px color-mix(in srgb,var(--vc-violet) 25%,transparent)}
.vc-link{display:inline-flex;align-items:center;gap:20px;font-size:15px;padding-block:10px}
.vc-link:hover{text-decoration:underline}
.vc-hero-circuit{position:absolute;width:100%;height:100%;inset:0;pointer-events:none}
.vc-wire{stroke:var(--vc-violet);stroke-width:.8;opacity:.34;vector-effect:non-scaling-stroke}
.vc-hero-circuit .vc-wire:nth-of-type(3n){opacity:.6}
.violet-circuit .vc-signal{stroke:var(--vc-bright);stroke-width:1.7;stroke-dasharray:22 978;stroke-dashoffset:calc(var(--phase) - var(--flow)*1000);vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px var(--vc-violet))}
.vc-routing-note{position:absolute;right:6.25%;top:51%;font:11px/2 var(--vc-mono);color:var(--vc-ink);padding:12px 0 12px 18px;background:var(--vc-ground)}
.vc-routing-note>span:last-child{color:var(--vc-muted)}
.vc-node{position:absolute;left:0;top:20px;width:5px;height:5px;background:var(--vc-violet)}
.vc-hero-foot{position:absolute;bottom:34px;left:6.25%;right:6.25%;display:flex;justify-content:space-between;gap:20px;font:10px/1.6 var(--vc-mono);letter-spacing:.06em;color:var(--vc-muted)}
.vc-composition{height:1040px;padding-top:100px}
.vc-compose-intro{position:relative;z-index:1;margin-left:38%;max-width:700px;padding:0 5% 0 0}
.violet-circuit h2{font-size:clamp(42px,4.5vw,72px)}
.vc-compose-intro p{margin-top:25px;max-width:420px}
.vc-branch-circuit{position:absolute;inset:235px 0 0;width:100%;height:850px;pointer-events:none}
.vc-branch{stroke:var(--vc-violet);stroke-width:1;opacity:.55;vector-effect:non-scaling-stroke;transition:stroke 180ms,opacity 180ms}
.vc-capability{position:absolute;z-index:2;max-width:400px;background:var(--vc-ground);padding:12px 18px 14px 28px}
.vc-capability-0{top:430px;left:46%}.vc-capability-1{top:630px;left:68%}.vc-capability-2{top:850px;left:33%}
.violet-circuit .vc-capability h3{font-size:clamp(23px,2.3vw,34px);letter-spacing:-.025em}
.vc-capability p{font-size:16px;margin-top:14px;max-width:280px}
.vc-detail{display:block;color:var(--vc-muted);font-size:13px;margin-top:18px}
.vc-detail span{display:inline-block;margin-left:10px;transition:transform 180ms}
.vc-capability:hover .vc-detail span{transform:translate(3px,-3px)}
.vc-terminal{position:absolute;left:-4px;top:25px;width:9px;height:9px;border:1px solid var(--vc-violet);background:var(--vc-ground);transition:background 180ms}
.vc-capability:hover .vc-terminal,.vc-capability:focus-visible .vc-terminal{background:var(--vc-violet)}
.vc-composition[data-active="0"] .vc-branch-0,.vc-composition[data-active="1"] .vc-branch-1,.vc-composition[data-active="2"] .vc-branch-2{stroke:var(--vc-bright);opacity:1;stroke-width:1.8}
.vc-govern{min-height:900px;display:flex;align-items:center;padding:130px 6.25% 160px;gap:6%;margin-top:100px}
.vc-aperture{width:53%;flex-shrink:0;margin-left:-11%;transform:rotate(-12deg)}
.vc-aperture svg{width:100%;overflow:visible}
.vc-aperture .vc-wire{stroke-width:.9;opacity:.55}
.vc-core{stroke:var(--vc-bright);stroke-width:1.3}
.vc-govern-copy{position:relative;max-width:650px}
.vc-govern-copy p{margin:32px 0 22px;max-width:450px}
.vc-govern-caption{position:absolute;bottom:70px;left:6.25%;font:11px/1.7 var(--vc-mono);color:var(--vc-muted)}
.vc-open{margin:0 6.25%;border-top:1px solid var(--vc-rule);padding:120px 0 100px;display:flex;align-items:center;justify-content:space-between;gap:60px}
.vc-open>div:first-child{max-width:530px}.vc-open p{max-width:450px;margin:30px 0 20px}
.vc-source-mark{display:flex;align-items:center;gap:28px;color:var(--vc-violet);font:200px/1 var(--vc-mono);margin-right:7%}
.vc-source-center{font:48px/1 var(--vc-display);color:var(--vc-ink);letter-spacing:-.035em}
.vc-source-center>span{display:block;font:11px/1 var(--vc-mono);color:var(--vc-muted);margin-top:20px;letter-spacing:0}
.vc-close{height:950px;margin-top:60px}
.vc-close-circuit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vc-close-copy{position:absolute;left:25%;top:38%;z-index:1;background:var(--vc-ground);padding:32px 55px}
.violet-circuit .vc-close h2{font-size:clamp(60px,7.5vw,112px)}
.vc-close-copy p{margin-top:28px}.vc-close-copy .vc-cta{margin-top:24px}
.vc-close-links{position:absolute;bottom:40px;left:6.25%;right:6.25%;display:flex;gap:35px;font-size:13px;color:var(--vc-muted)}
.vc-close-links a:hover{color:var(--vc-ink);text-decoration:underline}
@media(min-width:1700px){.vc-hero-copy{padding-left:12%}.vc-routing-note{right:12%}}
@media(max-width:1000px){
 .vc-hero{min-height:970px;height:100svh}.vc-hero-copy{width:85%;padding-top:110px}.violet-circuit h1{font-size:clamp(65px,9.6vw,100px)}
 .vc-hero-circuit{width:125%;left:-5%}.vc-routing-note{top:65%;right:7%}
 .vc-compose-intro{margin-left:22%}.vc-capability-0{left:42%}.vc-capability-1{left:56%}.vc-capability-2{left:27%}
 .vc-govern{gap:2%;min-height:760px}.vc-aperture{width:50%}.vc-source-mark{font-size:140px;margin-right:0;gap:10px}.vc-source-center{font-size:36px}
 .vc-close-copy{left:18%}
}
@media(max-width:600px){
 .vc-hero{height:1000px;min-height:0;max-height:none}.vc-hero-copy{width:100%;padding:85px 24px 0}.violet-circuit h1{font-size:clamp(42px,11.5vw,66px);letter-spacing:-.04em}
 .vc-hero-copy p{font-size:17px;max-width:320px;margin-top:30px}.vc-actions{gap:22px;align-items:flex-start;flex-direction:column;margin-top:24px}
 .vc-hero-circuit{width:220%;height:800px;left:-70%;top:250px;opacity:.8;mask-image:linear-gradient(transparent,black 28%)}
 .vc-routing-note{top:75%;right:24px;font-size:10px}.vc-hero-foot{left:24px;right:24px;bottom:26px;flex-direction:column;gap:6px;font-size:9px}
 .vc-composition{height:auto;padding:70px 24px 60px;min-height:920px}.vc-compose-intro{margin:0;padding:0;max-width:360px}.violet-circuit h2{font-size:40px}.vc-compose-intro p{font-size:17px}
 .vc-branch-circuit{display:none}.vc-capabilities{position:relative;margin:65px 0 0 14px;border-left:1px solid var(--vc-violet);padding-left:26px}
 .vc-capability{position:relative;display:block;top:auto;left:auto;padding:0 0 45px 12px;background:none;max-width:330px}.vc-capability:last-child{padding-bottom:0}
 .vc-terminal{left:-31px;top:10px}.vc-capability:before{content:'';position:absolute;left:-26px;top:14px;width:26px;border-top:1px solid var(--vc-violet)}
 .violet-circuit .vc-capability h3{font-size:25px}.vc-capability p{font-size:16px}.vc-detail{margin-top:12px}
 .vc-govern{margin-top:0;min-height:0;display:flex;flex-direction:column;padding:10px 24px 100px;align-items:stretch;gap:40px}.vc-aperture{width:115%;margin-left:-35%;max-width:500px}.vc-govern-copy p{margin-top:25px;font-size:17px}.vc-govern-caption{position:static;margin-top:20px;font-size:10px}
 .vc-open{margin:0 24px;padding:70px 0;flex-direction:column;align-items:flex-start;gap:55px}.vc-source-mark{align-self:flex-end;font-size:135px;gap:20px}.vc-source-center{font-size:38px}
 .vc-close{height:830px;margin-top:0}.vc-close-circuit{width:180%;left:-50%}.vc-close-copy{left:24px;right:24px;top:34%;padding:24px 0}.violet-circuit .vc-close h2{font-size:59px}.vc-close-links{left:24px;bottom:28px;flex-direction:column;gap:18px}
}
@media(prefers-reduced-motion:reduce){.violet-circuit .vc-signal{stroke-dashoffset:var(--phase)}.violet-circuit *{scroll-behavior:auto!important;transition:none!important}}
</style>
