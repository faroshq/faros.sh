<style>
.cm-page .faros-contact { --cm-error: #ff5d5d; --cm-success: #2fd6a0; }
:root[data-study-theme=light] .faros-contact { --cm-error: #b22a32; --cm-success: #067246; }
.cm-page .faros-contact {

  background: var(--contact-bg);
  color: var(--contact-text);
  font-family: StudyInstrument, sans-serif;

}
.cm-page .contact-shell { width: min(1160px, calc(100% - 3rem)); margin: auto; padding: 5rem 0 6rem; display: grid; grid-template-columns: 1fr 1.15fr; gap: clamp(3rem, 7vw, 6rem); align-items: start; }
.cm-page .contact-intro h1 { font-family: StudyInstrument, sans-serif; font-size: clamp(2.75rem, 4.5vw, 4.5rem); font-weight: 440; line-height: 1.08; letter-spacing: -.035em; margin: 0; }
.cm-page .contact-intro h1 span { color: var(--contact-accent); }

.cm-page .contact-channels strong { font-size: .95rem; font-weight: 500; display: block; }
.cm-page .contact-channels small { display: block; color: var(--contact-muted); font-size: .875rem; margin-top: .25rem; }

.cm-page .contact-channels a:hover strong { color: var(--contact-accent); }

</style>
