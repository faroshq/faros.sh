<a class="faros-nav-rich-link" href="{{ .href }}">
  <span class="faros-nav-rich-icon" aria-hidden="true">
    {{- if eq .icon "grid" -}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    {{- else if eq .icon "layers" -}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>
    {{- else if eq .icon "nodes" -}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="6" r="2"/><circle cx="5" cy="20" r="2"/><circle cx="19" cy="20" r="2"/><path d="m6 7 4 3m8-3-4 3m-7 8 3-4m7 4-3-4"/></svg>
    {{- else -}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="3"/><circle cx="19" cy="5" r="3"/><circle cx="19" cy="19" r="3"/><path d="m8 11 8-5M8 13l8 5"/></svg>{{- end -}}
  </span>
  <span><strong>{{ .title }}</strong><small>{{ .description }}</small></span>
</a>
