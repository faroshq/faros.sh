<script>
    async function sendContact(ev) {
      ev.preventDefault();
      const senderEmail = document
        .getElementById('emailInput').value;
      const senderMessage = document
        .getElementById('messageInput').value;
      const senderName = document
        .getElementById('nameInput').value;
      const senderCompany = document
        .getElementById('companyInput').value;

      const webhookBody = {
        embeds: [{
          title: 'Contact Form Submitted',
          fields: [{
              name: 'Sender',
              value: senderEmail
            },
            {
              name: 'Message',
              value: senderMessage
            },
            {
              name: 'Name',
              value: senderName
            },
            {
              name: 'Company',
              value: senderCompany
            }
          ]
        }],
      };
      const webhookUrl = 'https://discord.com/api/webhooks/1235608532083146785/qg9-lq7gzMIshnkGrS05Ham_cgk8w1xdmurpLt273LSFsL2Mn2C4ybArz-SV7RIEknLT';
      const response = await fetch(webhookUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(webhookBody),
      });
      if (response.ok) {
        // Show success message
        document.getElementById('contact-success-message').classList.remove('hidden');
        // Hide the form
        document.getElementById('contact-form').style.display = 'none';
        // Scroll to success message
        document.getElementById('contact-success-message').scrollIntoView({ behavior: 'smooth' });
      } else {
        alert('There was an error! Try again later!');
      }
    }
  </script>
