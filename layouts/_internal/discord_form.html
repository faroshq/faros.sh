<script>
    async function sendContact(ev) {
      ev.preventDefault();
      const senderEmail = document
        .getElementById('emailInput').value;
      const senderMessage = document
        .getElementById('messageInput').value;
      const senderName = document
        .getElementById('nameInput').value;
      const senderCompany = document
        .getElementById('companyInput').value;

      const webhookBody = {
        embeds: [{
          title: 'Contact Form Submitted',
          fields: [{
              name: 'Sender',
              value: senderEmail
            },
            {
              name: 'Message',
              value: senderMessage
            },
            {
              name: 'Name',
              value: senderName
            },
            {
              name: 'Company',
              value: senderCompany || 'Not provided'
            }
          ]
        }],
      };
      const webhookUrl = 'https://discord.com/api/webhooks/1484568469092434090/8tpYZXPU9cFRl5ZqwRuU0jW7LJvMH6tcTW4Vj12dJmBnQAqvilsS-8wkHauWlUK5nLJa';
      const form = document.getElementById('contact-form');
      const button = document.getElementById('contact-submit-button');
      const error = document.getElementById('contact-error');
      if (form.getAttribute('aria-busy') === 'true' || button.disabled || !form.reportValidity()) return;
      error.hidden = true;
      button.disabled = true;
      button.querySelector('span').textContent = 'Sending…';
      form.setAttribute('aria-busy', 'true');
      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(webhookBody),
        });
        if (!response.ok) throw new Error('Submission failed');
        const success = document.getElementById('contact-success-message');
        success.classList.remove('hidden');
        form.hidden = true;
        success.focus();
      } catch {
        error.textContent = 'Your message could not be sent. Please try again, or email mangirdas@judeikis.lt directly.';
        error.hidden = false;
      } finally {
        form.removeAttribute('aria-busy');
        button.disabled = !window.grecaptcha || !grecaptcha.getResponse();
        button.querySelector('span').textContent = 'Send message';
      }
    }
  </script>
