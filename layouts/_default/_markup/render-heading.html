{{/* Headings link to themselves; the anchor inherits heading colour and is
     never underlined (the docs body underlines ordinary links only). */}}
<h{{ .Level }}
  id="{{ .Anchor | safeURL }}"
  class="railgrid-docs-heading">
  <a href="{{ .Page.Permalink }}#{{ .Anchor | safeURL }}" class="railgrid-docs-anchor">{{ .Text | safeHTML }}</a>
</h{{ .Level }}>
