  <source src="{{ .Get "src" }}" type="video/mp4">

</video>
{{ else }}
<video width="" height="" controls>
  <source src="{{ .Get 0 }}" type="video/mp4">
  Your browser does not support the video tag.
</video>
{{ end }}
